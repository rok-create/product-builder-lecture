<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockDash - 객관적 주식 인사이트</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark-mode">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>실시간 트렌드</h2>
                <p>거래량/변동률 기준</p>
            </div>
            <ul id="trending-list" class="stock-list">
                <!-- Trending stocks will be injected here -->
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <input type="text" id="stock-search" placeholder="종목명 또는 코드 입력...">
                </div>
                <div class="market-status">
                    <span class="status-indicator live"></span> KOSPI 2,750.32 <span class="up">▲ 1.2%</span>
                </div>
            </header>

            <section class="dashboard-grid">
                <div class="stock-summary-card">
                    <div class="stock-info">
                        <h1 id="selected-stock-name">삼성전자</h1>
                        <span id="selected-stock-code">005930</span>
                    </div>
                    <div class="price-info">
                        <div class="current-price" id="current-price">78,500원</div>
                        <div class="price-change up" id="price-change">▲ 1,200 (1.55%)</div>
                    </div>
                </div>

                <div class="chart-container card">
                    <h3>주가 추이 (최근 30일)</h3>
                    <canvas id="stockChart"></canvas>
                </div>

                <div class="fundamentals-container">
                    <h3>핵심 재무 지표 (Fundamental)</h3>
                    <div class="metrics-grid">
                        <div class="metric-card card">
                            <span class="label">PER (주가수익비율)</span>
                            <span class="value" id="metric-per">35.21</span>
                        </div>
                        <div class="metric-card card">
                            <span class="label">PBR (주가순자산비율)</span>
                            <span class="value" id="metric-pbr">1.45</span>
                        </div>
                        <div class="metric-card card">
                            <span class="label">시가총액</span>
                            <span class="value" id="metric-marketcap">468.5조</span>
                        </div>
                        <div class="metric-card card">
                            <span class="label">EPS (주당순이익)</span>
                            <span class="value" id="metric-eps">2,230원</span>
                        </div>
                        <div class="metric-card card">
                            <span class="label">배당수익률</span>
                            <span class="value" id="metric-dividend">2.1%</span>
                        </div>
                        <div class="metric-card card">
                            <span class="label">ROE (자기자본이익률)</span>
                            <span class="value" id="metric-roe">12.5%</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
