<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockDash — 주식 인사이트</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">S</div>
                <div>
                    <div class="brand-name">StockDash</div>
                    <div class="brand-sub">실시간 트렌드</div>
                </div>
            </div>
            <div class="sidebar-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="stock-search" placeholder="종목 검색...">
            </div>
            <div class="sidebar-label">인기 종목</div>
            <ul id="trending-list" class="stock-list"></ul>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="market-pill">
                    <span class="live-dot"></span>
                    <span class="market-name">KOSPI</span>
                    <span class="market-value" id="kospi-value">—</span>
                    <span class="market-change up" id="kospi-change">—</span>
                </div>
                <div class="api-tools">
                    <label class="api-key-field" for="api-key">
                        <span>Finnhub</span>
                        <input id="api-key" type="password" placeholder="API 키">
                    </label>
                    <button class="api-save" id="save-api-key" type="button">저장</button>
                    <div class="update-time" id="update-time">—</div>
                </div>
            </header>

            <section class="stock-hero">
                <div class="hero-left">
                    <div class="stock-badge" id="selected-stock-code">005930</div>
                    <h1 class="stock-name" id="selected-stock-name">삼성전자</h1>
                </div>
                <div class="hero-right">
                    <div class="price" id="current-price">—</div>
                    <div class="price-delta up" id="price-change">—</div>
                </div>
            </section>

            <div class="content-grid">
                <div class="chart-card card">
                    <div class="card-header">
                        <span class="card-title">주가 추이</span>
                        <span class="card-sub">최근 7거래일</span>
                    </div>
                    <div class="chart-wrap">
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>

                <div class="metrics-card card">
                    <div class="card-header">
                        <span class="card-title">핵심 지표</span>
                    </div>
                    <div class="metrics-list">
                        <div class="metric-row">
                            <span class="metric-label">PER</span>
                            <span class="metric-value" id="metric-per">—</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">PBR</span>
                            <span class="metric-value" id="metric-pbr">—</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">시가총액</span>
                            <span class="metric-value" id="metric-marketcap">—</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">EPS</span>
                            <span class="metric-value" id="metric-eps">—</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">배당수익률</span>
                            <span class="metric-value" id="metric-dividend">—</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">ROE</span>
                            <span class="metric-value" id="metric-roe">—</span>
                        </div>
                    </div>
                </div>

                <div class="news-card card">
                    <div class="card-header">
                        <span class="card-title">오늘의 핵심 뉴스</span>
                        <span class="card-sub">3줄 요약</span>
                    </div>
                    <div id="news-content" class="news-content"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
